# Checks every push and pull request, then deploys main: the server to Fly.io and the site to test.phractsmack.lol.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  server:
    name: Server (format + compile + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      # downloaded dependencies and compiled code, reused while mix.lock is unchanged
      - uses: actions/cache@v4
        with:
          path: |
            apps/server/deps
            apps/server/_build
          key: mix-${{ runner.os }}-${{ hashFiles('apps/server/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  deploy-test:
    name: Deploy to test.phractsmack.lol
    needs: [web, server]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test
    env:
      HAS_DEVART: ${{ secrets.DEVART_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      # The private reference art, when the DEVART_TOKEN secret is set. Without it the build uses drawn placeholders.
      - name: Check out reference art
        if: env.HAS_DEVART == 'true'
        uses: actions/checkout@v7
        with:
          repository: tjballworm/age-three-devart
          token: ${{ secrets.DEVART_TOKEN }}
          path: age-three-devart
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build:test -w @age3/web
        env:
          AGE3_REF: ${{ github.workspace }}/age-three-devart/dominionofages
          # the game server the test site connects to (repo variable SERVER_URL); empty means sample data
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      - name: Deploy
        run: >-
          npx --yes netlify-cli@21.6.0 deploy --prod --no-build --dir apps/web/dist
          --site 9024495a-24bc-47b8-baeb-724285920c9c --filter @age3/web
          --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  deploy-server:
    name: Deploy server to Fly.io
    needs: [web, server]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test
    env:
      HAS_FLY: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_FLY == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        if: env.HAS_FLY == 'true'
        with:
          version: 0.4.113
      - name: Deploy
        if: env.HAS_FLY == 'true'
        run: flyctl deploy --remote-only apps/server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
